services:
  vbudget-next:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env.test
    volumes:
      - vbudget-uploads-test:/app/data/uploads
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: unless-stopped

  postgres-test:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    volumes:
      - vbudget-pg-test-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vbudget
      POSTGRES_PASSWORD: vbudget_test
      POSTGRES_DB: vbudget
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbudget"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vbudget-pg-test-data:
  vbudget-uploads-test:  # non-persistent: cleared when `docker-compose down -v`
