services:
  vbudget-next:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    volumes:
      - vbudget-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - vbudget-pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: setcash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setcash_dev}
      POSTGRES_DB: setcash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setcash"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vbudget-pg-backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: setcash
      POSTGRES_USER: setcash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setcash_dev}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    restart: unless-stopped

volumes:
  vbudget-pg-data:
  vbudget-uploads:
  vbudget-pg-backups:
