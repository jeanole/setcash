services:
  vbudget:
    image: jeanlosch/vbudget:latest
    container_name: vbudget
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "3000:3001"
    volumes:
      - /dockerfiles/vbudget:/app/data
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vbudget-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  postgres:
    image: postgres:15-alpine
    container_name: vbudget-postgres
    restart: unless-stopped
    volumes:
      - /dockerfiles/vbudget-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vbudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vbudget_secret}
      POSTGRES_DB: vbudget
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbudget"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vbudget-net

networks:
  vbudget-net:
    driver: bridge
