<!DOCTYPE html>
<html>
<body style="margin:0;background:#020617;display:flex;align-items:center;justify-content:center;height:100vh;">
  <div style="text-align:center;">
    <div style="margin-bottom:12px;display:inline-block;">
      <svg width="72" height="62" viewBox="0 0 72 62" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="36" cy="60" rx="22" ry="2" fill="#000" opacity="0.3"/>
        <!-- bills from bottom to top, each with heavy drooping ends -->
        <!-- format: M lx,{yc+d} C lcp,yc rcp,yc rx,{yc+d} L rx,{yc+d+h} C rcp,{yc+h} lcp,{yc+h} lx,{yc+d+h} Z -->
        <!-- droop = 7px, h = 5px -->

        <!-- bill 8 (bottom) -->
        <path d="M8,52 C20,45 52,45 64,52 L64,57 C52,50 20,50 8,57 Z" fill="#1a380c"/>
        <!-- bill 7 -->
        <path d="M6,46 C18,39 54,40 66,47 L66,52 C54,45 18,44 6,51 Z" fill="#22420e"/>
        <!-- bill 6 -->
        <path d="M10,40 C22,33 50,34 62,41 L62,46 C50,39 22,38 10,45 Z" fill="#2e5412"/>
        <!-- bill 5 - yellowed -->
        <path d="M7,34 C20,27 52,28 65,35 L65,40 C52,33 20,32 7,39 Z" fill="#575a14"/>
        <!-- bill 4 -->
        <path d="M5,28 C18,21 54,22 67,29 L67,34 C54,27 18,26 5,33 Z" fill="#376018"/>
        <!-- bill 3 - more worn -->
        <path d="M9,22 C21,15 51,16 63,23 L63,28 C51,21 21,20 9,27 Z" fill="#52561a"/>
        <!-- bill 2 -->
        <path d="M7,16 C19,9 53,10 65,17 L65,22 C53,15 19,14 7,21 Z" fill="#426c1e"/>
        <!-- bill 1 (top) -->
        <path d="M9,10 C21,3 51,4 63,11 L63,16 C51,9 21,8 9,15 Z" fill="#4e7222"/>
      </svg>
    </div>
    <h1 style="color:#ffffff;font-size:24px;font-weight:700;margin:0;font-family:sans-serif;">SetCash</h1>
  </div>
</body>
</html>
