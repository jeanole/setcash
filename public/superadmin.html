<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>vBudget - Super Admin</title>
        <link rel="stylesheet" href="/style.css" />
        <style>
            .sa-badge {
                display: inline-block;
                background: #e74c3c;
                color: #fff;
                font-size: 11px;
                font-weight: 600;
                padding: 2px 8px;
                border-radius: 10px;
                letter-spacing: 0.3px;
                vertical-align: middle;
            }
            .hint {
                font-size: 0.85em;
                color: #666;
                margin-top: 4px;
            }
            .membership-modal .modal-content {
                max-width: 700px;
            }
            .membership-section {
                margin-bottom: 24px;
                padding-bottom: 24px;
                border-bottom: 1px solid #eee;
            }
            .membership-section:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }
        </style>
    </head>
    <body>
        <h1>Super Admin</h1>

        <div class="tabs">
            <button class="tab active" data-tab="projects">Projects</button>
            <button class="tab" data-tab="users">Global Users</button>
        </div>

        <!-- ==================== PROJECTS TAB ==================== -->
        <div id="tab-projects" class="tab-content active">
            <div class="card">
                <h2>All Projects</h2>
                <form id="projectForm" class="inline-form">
                    <input
                        type="text"
                        name="name"
                        placeholder="Project name"
                        required
                    />
                    <input
                        type="text"
                        name="subtitle"
                        placeholder="Subtitle (optional)"
                    />
                    <button type="submit">Create Project</button>
                </form>
                <div id="projectResult"></div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Subtitle</th>
                            <th>Created</th>
                            <th>Members</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ==================== GLOBAL USERS TAB ==================== -->
        <div id="tab-users" class="tab-content">
            <div class="card">
                <h2>Global Users</h2>
                <form id="userForm" class="inline-form" style="flex-wrap: wrap">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                    />
                    <div class="password-wrapper">
                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        />
                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePw(this)"
                        >
                            Show
                        </button>
                    </div>
                    <label
                        style="
                            flex-direction: row;
                            align-items: center;
                            gap: 6px;
                            font-weight: 400;
                        "
                    >
                        <input type="checkbox" name="isSuperAdmin" /> Super
                        Admin
                    </label>
                    <button type="submit">Create User</button>
                </form>
                <p class="hint">Password must be at least 6 characters.</p>
                <div id="userResult"></div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Super Admin</th>
                            <th>Projects</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ==================== MEMBERSHIP MODAL ==================== -->
        <div
            id="membershipModal"
            class="modal membership-modal"
            style="display: none"
            onclick="if (event.target === this) closeMemberships();"
        >
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="membershipModalTitle">Members</h2>
                    <button class="modal-close" onclick="closeMemberships()">
                        &#x2715;
                    </button>
                </div>
                <div class="modal-body">
                    <div class="membership-section">
                        <h3>Members</h3>
                        <div
                            class="inline-form"
                            style="flex-wrap: wrap; margin-bottom: 10px"
                        >
                            <select id="memberEmailSelect">
                                <option value="">-- Select user --</option>
                            </select>
                            <select id="memberRoleSelect">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                            <select id="memberPosSelect">
                                <option value="">-- No position --</option>
                            </select>
                            <button type="button" onclick="addMember()">
                                Add Member
                            </button>
                        </div>
                        <div id="memberResult"></div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Position</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="memberBody"></tbody>
                        </table>
                    </div>

                    <div class="membership-section">
                        <h3>Positions</h3>
                        <div class="inline-form" style="margin-bottom: 10px">
                            <input
                                type="text"
                                id="positionNameInput"
                                placeholder="Position name"
                            />
                            <button type="button" onclick="addPosition()">
                                Add Position
                            </button>
                        </div>
                        <div id="positionResult"></div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="positionBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <p>
            <a href="/">Back</a> | <a href="/logout">Logout</a> |
            <span id="saVersion" style="color: #999; font-size: 0.85em"></span>
        </p>

        <script>
            function togglePw(btn) {
                const i = btn.previousElementSibling;
                const show = i.type === "password";
                i.type = show ? "text" : "password";
                btn.textContent = show ? "Hide" : "Show";
            }
            const esc = (t) => {
                const d = document.createElement("div");
                d.textContent = t || "";
                return d.innerHTML;
            };
            const msg = (id, t, err) => {
                const e = document.getElementById(id);
                e.textContent = t;
                e.className = "message " + (err ? "error" : "success");
                setTimeout(() => (e.textContent = ""), err ? 6000 : 3000);
            };

            // Tab switching
            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", () => {
                    document
                        .querySelectorAll(".tab")
                        .forEach((t) => t.classList.remove("active"));
                    document
                        .querySelectorAll(".tab-content")
                        .forEach((c) => c.classList.remove("active"));
                    tab.classList.add("active");
                    document
                        .getElementById("tab-" + tab.dataset.tab)
                        .classList.add("active");
                });
            });

            let allProjects = [];
            let allUsers = [];
            let currentUserEmail = "";

            // ==================== PROJECTS ====================
            async function loadProjects() {
                try {
                    allProjects = await (
                        await fetch("/api/superadmin/projects")
                    ).json();
                    document.getElementById("projectBody").innerHTML =
                        allProjects
                            .map(
                                (p) => `<tr>
          <td>${p.id}</td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.subtitle || "")}</td>
          <td>${p.created_at ? new Date(p.created_at).toLocaleDateString("de-DE") : ""}</td>
          <td>${p.member_count}</td>
          <td>
            <button class="small" onclick="openMemberships(${p.id}, '${esc(p.name).replace(/'/g, "&#39;")}')">Members</button>
            <button class="small secondary" onclick="editProject(${p.id}, '${esc(p.name).replace(/'/g, "&#39;")}', '${esc(p.subtitle || "").replace(/'/g, "&#39;")}')">Edit</button>
            <button class="small danger" onclick="deleteProject(${p.id}, '${esc(p.name).replace(/'/g, "&#39;")}')">Delete</button>
          </td>
        </tr>`,
                            )
                            .join("");
                } catch (e) {
                    console.error("Error loading projects", e);
                }
            }

            document.getElementById("projectForm").onsubmit = async (e) => {
                e.preventDefault();
                const f = e.target;
                const res = await fetch("/api/superadmin/projects", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: f.name.value,
                        subtitle: f.subtitle.value,
                    }),
                });
                const j = await res.json();
                if (j.ok) {
                    msg(
                        "projectResult",
                        "Project created (ID: " + j.id + ")",
                        false,
                    );
                    f.reset();
                    loadProjects();
                } else msg("projectResult", j.error || "Error", true);
            };

            async function editProject(id, name, subtitle) {
                const newName = prompt("Project name:", name);
                if (newName === null) return;
                const newSub = prompt("Subtitle:", subtitle);
                if (newSub === null) return;
                const res = await fetch("/api/superadmin/projects/" + id, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: newName, subtitle: newSub }),
                });
                const j = await res.json();
                if (j.ok) {
                    msg("projectResult", "Project updated", false);
                    loadProjects();
                } else msg("projectResult", j.error || "Error", true);
            }

            async function deleteProject(id, name) {
                if (
                    !confirm(
                        'Delete project "' +
                            name +
                            '"?\n\nThis will permanently delete ALL project data (bills, budgets, motives, categories, members, positions, etc). This cannot be undone.',
                    )
                )
                    return;
                const res = await fetch("/api/superadmin/projects/" + id, {
                    method: "DELETE",
                });
                const j = await res.json();
                if (j.ok) {
                    msg("projectResult", "Project deleted", false);
                    loadProjects();
                } else msg("projectResult", j.error || "Error", true);
            }

            // ==================== GLOBAL USERS ====================
            async function loadUsers() {
                try {
                    allUsers = await (
                        await fetch("/api/superadmin/users")
                    ).json();
                    document.getElementById("userBody").innerHTML = allUsers
                        .map(
                            (u) => `<tr>
          <td>${esc(u.email)}</td>
          <td>${u.superAdmin ? '<span class="sa-badge">SUPER ADMIN</span>' : "No"}
            <button class="small secondary" onclick="toggleSuperAdmin('${esc(u.email).replace(/'/g, "&#39;")}', ${!u.superAdmin})">${u.superAdmin ? "Revoke" : "Grant"}</button>
          </td>
          <td>${u.projectCount}</td>
          <td>
            <button class="small secondary" onclick="resetPassword('${esc(u.email).replace(/'/g, "&#39;")}')">Reset PW</button>
            <button class="small danger" onclick="deleteUser('${esc(u.email).replace(/'/g, "&#39;")}')">Delete</button>
          </td>
        </tr>`,
                        )
                        .join("");
                    updateMemberEmailSelect();
                } catch (e) {
                    console.error("Error loading users", e);
                }
            }

            document.getElementById("userForm").onsubmit = async (e) => {
                e.preventDefault();
                const f = e.target;
                const res = await fetch("/api/superadmin/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: f.email.value,
                        password: f.password.value,
                        superAdmin: f.isSuperAdmin.checked,
                    }),
                });
                const j = await res.json();
                if (j.ok) {
                    msg("userResult", "User created", false);
                    f.reset();
                    loadUsers();
                } else msg("userResult", j.error || "Error", true);
            };

            async function toggleSuperAdmin(email, newVal) {
                const res = await fetch(
                    "/api/superadmin/users/" + encodeURIComponent(email),
                    {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ superAdmin: newVal }),
                    },
                );
                const j = await res.json();
                if (j.ok) loadUsers();
                else msg("userResult", j.error || "Error", true);
            }

            async function resetPassword(email) {
                const pw = prompt("New password for " + email + ":");
                if (!pw) return;
                const res = await fetch(
                    "/api/superadmin/users/" + encodeURIComponent(email),
                    {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ password: pw }),
                    },
                );
                const j = await res.json();
                if (j.ok) msg("userResult", "Password reset", false);
                else msg("userResult", j.error || "Error", true);
            }

            async function deleteUser(email) {
                if (
                    !confirm(
                        'Delete user "' +
                            email +
                            '"?\n\nThis removes them from all projects.',
                    )
                )
                    return;
                const res = await fetch(
                    "/api/superadmin/users/" + encodeURIComponent(email),
                    { method: "DELETE" },
                );
                const j = await res.json();
                if (j.ok) {
                    msg("userResult", "User deleted", false);
                    loadUsers();
                } else msg("userResult", j.error || "Error", true);
            }

            // ==================== MEMBERSHIP MODAL ====================
            let membershipPositions = [];
            let currentMembers = [];
            let currentMembershipProjectId = null;

            function openMemberships(projectId, projectName) {
                currentMembershipProjectId = projectId;
                document.getElementById("membershipModalTitle").textContent =
                    projectName + " — Members";
                document.getElementById("membershipModal").style.display =
                    "flex";
                document.body.style.overflow = "hidden";
                loadMemberships();
            }

            function closeMemberships() {
                document.getElementById("membershipModal").style.display =
                    "none";
                document.body.style.overflow = "";
                currentMembershipProjectId = null;
                loadProjects(); // refresh member count in table
            }

            function updateMemberEmailSelect() {
                const sel = document.getElementById("memberEmailSelect");
                const currentEmails = new Set(
                    currentMembers.map((m) => m.email.toLowerCase()),
                );
                sel.innerHTML =
                    '<option value="">-- Select user --</option>' +
                    allUsers
                        .map((u) => {
                            const isMe =
                                currentUserEmail &&
                                u.email.toLowerCase() ===
                                    currentUserEmail.toLowerCase();
                            const isMember = currentEmails.has(
                                u.email.toLowerCase(),
                            );
                            let label = esc(u.email);
                            if (isMe) label += " (you)";
                            if (isMember) label += " — already member";
                            const style = isMember
                                ? "color:#aaa"
                                : isMe
                                  ? "color:#2980b9;font-weight:600"
                                  : "";
                            return `<option value="${esc(u.email)}"${style ? ` style="${style}"` : ""}>${label}</option>`;
                        })
                        .join("");
            }

            async function loadMemberships() {
                const projectId = currentMembershipProjectId;
                if (!projectId) return;

                // Load positions
                try {
                    membershipPositions = await (
                        await fetch(
                            "/api/superadmin/projects/" +
                                projectId +
                                "/positions",
                        )
                    ).json();
                    document.getElementById("memberPosSelect").innerHTML =
                        '<option value="">-- No position --</option>' +
                        membershipPositions
                            .map(
                                (p) =>
                                    `<option value="${p.id}">${esc(p.name)}</option>`,
                            )
                            .join("");
                    document.getElementById("positionBody").innerHTML =
                        membershipPositions
                            .map((p) => {
                                const isMisc = p.name === "Misc";
                                return `<tr>
            <td>${esc(p.name)}</td>
            <td>${
                isMisc
                    ? ""
                    : `<button class="small secondary" onclick="renamePosition(${p.id}, '${esc(p.name).replace(/'/g, "&#39;")}')">Rename</button>
              <button class="small danger" onclick="deletePosition(${p.id})">Delete</button>`
            }</td>
          </tr>`;
                            })
                            .join("");
                } catch (e) {
                    console.error("Error loading positions", e);
                }

                // Load members
                try {
                    currentMembers = await (
                        await fetch(
                            "/api/superadmin/projects/" +
                                projectId +
                                "/members",
                        )
                    ).json();
                    const posOptions =
                        '<option value="">-- None --</option>' +
                        membershipPositions
                            .map(
                                (p) =>
                                    `<option value="${p.id}">${esc(p.name)}</option>`,
                            )
                            .join("");
                    document.getElementById("memberBody").innerHTML =
                        currentMembers
                            .map((m) => {
                                const roleSelect = `<select onchange="updateMemberRole(${m.id}, this.value)">
            <option value="user" ${m.projectRole === "user" ? "selected" : ""}>User</option>
            <option value="admin" ${m.projectRole === "admin" ? "selected" : ""}>Admin</option>
          </select>`;
                                const posSelect =
                                    membershipPositions.length > 0
                                        ? `<select onchange="updateMemberPosition(${m.id}, this.value)">` +
                                          posOptions.replace(
                                              `value="${m.positionId}"`,
                                              `value="${m.positionId}" selected`,
                                          ) +
                                          "</select>"
                                        : m.positionName || "—";
                                return `<tr>
            <td>${esc(m.email)}</td>
            <td>${roleSelect}</td>
            <td>${posSelect}</td>
            <td><button class="small danger" onclick="removeMember(${m.id}, '${esc(m.email).replace(/'/g, "&#39;")}')">Remove</button></td>
          </tr>`;
                            })
                            .join("");
                    updateMemberEmailSelect();
                } catch (e) {
                    console.error("Error loading members", e);
                }
            }

            async function addMember() {
                const projectId = currentMembershipProjectId;
                if (!projectId) return;
                const emailSel = document.getElementById("memberEmailSelect");
                const roleSel = document.getElementById("memberRoleSelect");
                const posSel = document.getElementById("memberPosSelect");
                if (!emailSel.value)
                    return msg("memberResult", "Select a user first", true);
                try {
                    const res = await fetch(
                        "/api/superadmin/projects/" + projectId + "/members",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                email: emailSel.value,
                                projectRole: roleSel.value,
                                positionId: posSel.value
                                    ? parseInt(posSel.value)
                                    : null,
                            }),
                        },
                    );
                    const j = await res.json();
                    if (j.ok) {
                        msg("memberResult", "Member added", false);
                        emailSel.value = "";
                        loadMemberships();
                    } else msg("memberResult", j.error || "Error", true);
                } catch (e) {
                    msg("memberResult", "Request failed: " + e.message, true);
                }
            }

            async function updateMemberRole(memberId, role) {
                const res = await fetch(
                    "/api/superadmin/projects/" +
                        currentMembershipProjectId +
                        "/members/" +
                        memberId,
                    {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ projectRole: role }),
                    },
                );
                const j = await res.json();
                if (!j.ok) msg("memberResult", j.error || "Error", true);
            }

            async function updateMemberPosition(memberId, positionId) {
                const res = await fetch(
                    "/api/superadmin/projects/" +
                        currentMembershipProjectId +
                        "/members/" +
                        memberId,
                    {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            positionId: positionId
                                ? parseInt(positionId)
                                : null,
                        }),
                    },
                );
                const j = await res.json();
                if (!j.ok) msg("memberResult", j.error || "Error", true);
            }

            async function removeMember(memberId, email) {
                if (!confirm("Remove " + email + " from this project?")) return;
                const res = await fetch(
                    "/api/superadmin/projects/" +
                        currentMembershipProjectId +
                        "/members/" +
                        memberId,
                    { method: "DELETE" },
                );
                const j = await res.json();
                if (j.ok) {
                    msg("memberResult", "Member removed", false);
                    loadMemberships();
                } else msg("memberResult", j.error || "Error", true);
            }

            async function addPosition() {
                const input = document.getElementById("positionNameInput");
                const name = input.value.trim();
                if (!name)
                    return msg("positionResult", "Enter a position name", true);
                const res = await fetch(
                    "/api/superadmin/projects/" +
                        currentMembershipProjectId +
                        "/positions",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name }),
                    },
                );
                const j = await res.json();
                if (j.ok) {
                    msg("positionResult", "Position added", false);
                    input.value = "";
                    loadMemberships();
                } else msg("positionResult", j.error || "Error", true);
            }

            async function renamePosition(posId, oldName) {
                const newName = prompt(
                    'Rename position "' + oldName + '" to:',
                    oldName,
                );
                if (!newName || newName === oldName) return;
                const res = await fetch(
                    "/api/superadmin/projects/" +
                        currentMembershipProjectId +
                        "/positions/" +
                        posId,
                    {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: newName }),
                    },
                );
                const j = await res.json();
                if (j.ok) {
                    msg("positionResult", "Position renamed", false);
                    loadMemberships();
                } else msg("positionResult", j.error || "Error", true);
            }

            async function deletePosition(posId) {
                if (
                    !confirm(
                        "Delete this position? Members with this position will revert to unset.",
                    )
                )
                    return;
                const res = await fetch(
                    "/api/superadmin/projects/" +
                        currentMembershipProjectId +
                        "/positions/" +
                        posId,
                    { method: "DELETE" },
                );
                const j = await res.json();
                if (j.ok) {
                    msg("positionResult", "Deleted", false);
                    loadMemberships();
                } else msg("positionResult", j.error || "Error", true);
            }

            // ==================== INIT ====================
            fetch("/api/user")
                .then((r) => r.json())
                .then((u) => {
                    if (u) currentUserEmail = u.email;
                });
            loadProjects();
            loadUsers();
            fetch("/api/project-info")
                .then((r) => r.json())
                .then((d) => {
                    if (d.version)
                        document.getElementById("saVersion").textContent =
                            "v" + d.version;
                });
        </script>
    </body>
</html>
