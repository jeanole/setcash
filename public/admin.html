<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>vBudget - Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Admin Panel</h1>

  <div class="card">
    <h2>Users</h2>
    <form id="userForm" class="inline-form">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="admin"> Admin</label>
      <button type="submit">Add User</button>
    </form>
    <div id="userResult"></div>
    <table class="data-table">
      <thead><tr><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody id="userBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Google Integration</h2>
    <div id="credStatus" style="margin-bottom:12px"></div>

    <h3>Google Sheets</h3>
    <form id="settingsForm" class="inline-form">
      <label style="flex-direction:row;align-items:center;gap:6px">
        <input type="checkbox" name="googleSheetEnabled" id="sheetEnabled"> Sync enabled
      </label>
      <input type="text" name="googleSheetId" id="sheetId" placeholder="Google Sheet ID" style="flex:1">
      <button type="submit">Save</button>
    </form>
    <div id="settingsResult"></div>
    <p style="font-size:0.85em;color:#666">Sheet ID is the long string in the URL between /d/ and /edit</p>

    <h3 style="margin-top:20px">Service Account Credentials</h3>
    <form id="credForm">
      <textarea id="credJson" placeholder="Paste service account JSON here..." style="width:100%;height:100px;font-family:monospace;font-size:12px"></textarea>
      <button type="submit" style="margin-top:8px">Save Credentials</button>
    </form>
    <div id="credResult"></div>
  </div>

  <p><a href="/">Back</a> | <a href="/logout">Logout</a></p>

  <script>
    const esc = t => { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; };
    const fmt = n => new Intl.NumberFormat('de-DE', {style:'currency',currency:'EUR'}).format(n||0);
    const msg = (id, t, err) => { const e = document.getElementById(id); e.textContent = t; e.className = 'message ' + (err ? 'error' : 'success'); setTimeout(() => e.textContent = '', 3000); };

    async function loadUsers() {
      const tbody = document.getElementById('userBody');
      try {
        const users = await (await fetch('/api/admin/users')).json();
        tbody.innerHTML = users.map(u => `<tr>
          <td>${esc(u.email)}</td>
          <td>${u.admin ? 'Admin' : 'User'}</td>
          <td>
            <button class="small secondary" onclick="resetPassword('${esc(u.email)}')">Reset PW</button>
            <button class="small ${u.admin ? '' : 'secondary'}" onclick="toggleAdmin('${esc(u.email)}', ${!u.admin})">${u.admin ? 'Demote' : 'Promote'}</button>
            <button class="small danger" onclick="deleteUser('${esc(u.email)}')">Delete</button>
          </td>
        </tr>`).join('');
      } catch (e) { tbody.innerHTML = '<tr><td colspan="3">Error</td></tr>'; }
    }

    document.getElementById('userForm').onsubmit = async e => {
      e.preventDefault();
      const f = e.target;
      const res = await fetch('/api/admin/users', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: f.email.value, password: f.password.value, admin: f.admin.checked })
      });
      const j = await res.json();
      if (j.ok) { msg('userResult', 'User added', false); f.reset(); loadUsers(); }
      else msg('userResult', j.error || 'Error', true);
    };

    async function resetPassword(email) {
      const pw = prompt('New password for ' + email + ':');
      if (!pw) return;
      const res = await fetch('/api/admin/users/' + encodeURIComponent(email), {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: pw })
      });
      const j = await res.json();
      msg('userResult', j.ok ? 'Password reset' : (j.error || 'Error'), !j.ok);
    }

    async function toggleAdmin(email, makeAdmin) {
      const res = await fetch('/api/admin/users/' + encodeURIComponent(email), {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admin: makeAdmin })
      });
      const j = await res.json();
      if (j.ok) loadUsers();
      else msg('userResult', j.error || 'Error', true);
    }

    async function deleteUser(email) {
      if (!confirm('Delete ' + email + '?')) return;
      const res = await fetch('/api/admin/users/' + encodeURIComponent(email), { method: 'DELETE' });
      const j = await res.json();
      if (j.ok) { msg('userResult', 'Deleted', false); loadUsers(); }
      else msg('userResult', j.error || 'Error', true);
    }

    async function loadSettings() {
      try {
        const settings = await (await fetch('/api/admin/settings')).json();
        document.getElementById('sheetEnabled').checked = settings.googleSheetEnabled;
        document.getElementById('sheetId').value = settings.googleSheetId || '';
      } catch (e) { console.error('Error loading settings', e); }
    }

    document.getElementById('settingsForm').onsubmit = async e => {
      e.preventDefault();
      const res = await fetch('/api/admin/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          googleSheetEnabled: document.getElementById('sheetEnabled').checked,
          googleSheetId: document.getElementById('sheetId').value
        })
      });
      const j = await res.json();
      msg('settingsResult', j.ok ? 'Settings saved' : (j.error || 'Error'), !j.ok);
    };

    async function loadCredStatus() {
      try {
        const status = await (await fetch('/api/admin/google-credentials/status')).json();
        const el = document.getElementById('credStatus');
        if (status.configured) {
          el.innerHTML = '<span style="color:green">Credentials configured</span><br><small>Service account: ' + esc(status.email) + '</small>';
        } else {
          el.innerHTML = '<span style="color:orange">No credentials configured</span>';
        }
      } catch (e) { console.error('Error loading cred status', e); }
    }

    document.getElementById('credForm').onsubmit = async e => {
      e.preventDefault();
      const res = await fetch('/api/admin/google-credentials', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ credentials: document.getElementById('credJson').value })
      });
      const j = await res.json();
      if (j.ok) {
        msg('credResult', 'Credentials saved! Share sheet with: ' + j.email, false);
        document.getElementById('credJson').value = '';
        loadCredStatus();
      } else {
        msg('credResult', j.error || 'Error', true);
      }
    };

    loadUsers();
    loadSettings();
    loadCredStatus();
  </script>
</body>
</html>
